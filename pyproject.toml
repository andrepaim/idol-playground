[project]
name = "idol-playground"
version = "0.1.0"
description = "A small local image-to-3D playground for Speridlabs Idol"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20",
  "pillow>=11,<13",
  "huggingface-hub>=0.34,<2",
]

[project.optional-dependencies]
local = ["idol @ git+https://github.com/speridlabs/idol-sdk.git@8db700349a5570aac390e4780fa32e3eed6b587a"]
cpu = ["torch==2.15.0"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "playwright>=1.50,<2", "ruff>=0.14,<1", "pyyaml>=6,<7"]

[tool.uv]
package = false
required-version = "==0.12.3"
conflicts = [[{extra = "cpu"}, {extra = "local"}]]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/test_mesh_diagnostics.py", "tests/test_gpu_reservation.py", "tests/test_anatomy_reasoning.py", "tests/test_character_api.py", "tests/test_worker_leases.py", "tests/test_character_executor.py", "tests/test_character_coordinator.py", "tests/test_character_publication.py", "tests/test_character_store.py", "tests/test_character_contracts.py", "tests/test_playable_package.py", "tests/test_app.py", "tests/test_progress.py", "tests/test_mesh.py", "tests/test_rig.py", "tests/test_walk.py", "tests/test_splat_mesh.py", "tests/test_splat_integration.py", "experiments/walking/test_pose.py"]

[tool.uv.sources]
torch = [{index = "pytorch-cpu", extra = "cpu"}]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
exclude = ["models", "outputs", "dist", ".local"]

[tool.ruff.lint]
select = ["E9", "F"]
