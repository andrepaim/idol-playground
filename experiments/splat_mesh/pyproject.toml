[project]
name = "idol-splat-mesh-experiment"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["torch==2.5.1", "torchvision==0.20.1", "numpy==1.26.4", "opencv-python-headless==4.11.0.86", "open3d==0.19.0", "trimesh==4.5.3", "pillow==13.0.0", "timm==1.0.15", "einops==0.8.1", "opt-einsum==3.4.0", "scikit-image==0.26.0", "matplotlib==3.11.2", "fast-simplification==0.1.7", "playwright==1.65.0", "psutil==6.1.1"]
[tool.uv]
package = false
[tool.uv.sources]
torch = {index="pytorch-cu124"}
