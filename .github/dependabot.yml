version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: uv
    directory: /backends/triposr
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: uv
    directory: /backends/unirig
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /experiments/splat_mesh
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
