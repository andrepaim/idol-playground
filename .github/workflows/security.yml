name: Repository security
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
jobs:
  repository-security:
    name: Secrets and generated-data guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test generated-data guard
        run: python3 -m unittest discover -s scripts -p test_repository_data_guard.py
      - name: Scan history and private/generated files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/security.sh
