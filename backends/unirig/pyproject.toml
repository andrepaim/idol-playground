  "python-box==7.3.2", "einops==0.8.1", "omegaconf==2.3.0", "lightning==2.5.1",
  "pytorch-lightning==2.5.1", "addict==2.4.0", "timm==1.0.15", "fast-simplification==0.1.7",
  "bpy==4.2.0", "trimesh==4.5.3", "open3d==0.19.0", "pyrender==0.1.45",
  "huggingface-hub==0.30.2", "wandb==0.19.9", "spconv-cu124==2.3.8", "psutil==6.1.1",
  "torch-scatter @ https://data.pyg.org/whl/torch-2.5.0%2Bcu124/torch_scatter-2.1.2%2Bpt25cu124-cp311-cp311-linux_x86_64.whl",
  "torch-cluster @ https://data.pyg.org/whl/torch-2.5.0%2Bcu124/torch_cluster-1.6.3%2Bpt25cu124-cp311-cp311-linux_x86_64.whl",
  "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1%2Bcu12torch2.5cxx11abiFALSE-cp311-cp311-linux_x86_64.whl",
